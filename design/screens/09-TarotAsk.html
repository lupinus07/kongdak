<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>콩닥 타로 고민 선택</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&amp;family=Gowun+Dodum&amp;display=swap">
<style>
body{margin:0}
a{color:#C2255C}a:hover{color:#A61E4D}
textarea::placeholder{color:#B88A9C}
</style>
<style>body{background:#F3E6EB;display:flex;justify-content:center;padding:24px 0}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFF0F5; font-family: 'Gowun Dodum', 'Apple SD Gothic Neo', sans-serif; color: #4A2B38; display: flex; flex-direction: column; padding: 24px 22px; gap: 18px; overflow: hidden">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="Main.dc.html" aria-label="뒤로" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C2255C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <span style="font-family: 'Jua', sans-serif; font-size: 18px">콩닥 타로</span>
    <div style="width: 44px; height: 44px"></div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 4px">
    <h1 style="margin: 0; font-family: 'Jua', sans-serif; font-size: 28px; font-weight: 400">요즘 어떤 고민이<br>있어요?</h1>
    <p style="margin: 0; font-size: 15px; color: #7A5566">고민을 고르면 카드가 답해줄게요</p>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <button style="height: 64px; border-radius: 20px; border: 2px solid #C2255C; background: #FFFFFF; display: flex; align-items: center; gap: 10px; padding: 0 14px; font-family: 'Jua', sans-serif; font-size: 16px; color: #C2255C; text-align: left">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z" fill="#FF6B9A"></path></svg>짝사랑</button>
    <button style="height: 64px; border-radius: 20px; border: 2px solid transparent; background: #FFFFFF; display: flex; align-items: center; gap: 10px; padding: 0 14px; font-family: 'Jua', sans-serif; font-size: 16px; color: #4A2B38; text-align: left">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#C2255C" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 12c2-4 5-6 8-6s6 2 8 6c-2 4-5 6-8 6s-6-2-8-6z"></path><circle cx="12" cy="12" r="2.5"></circle></svg>그 사람 속마음</button>
    <button style="height: 64px; border-radius: 20px; border: 2px solid transparent; background: #FFFFFF; display: flex; align-items: center; gap: 10px; padding: 0 14px; font-family: 'Jua', sans-serif; font-size: 16px; color: #4A2B38; text-align: left">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#C2255C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 17c3 0 4-10 8-10s5 10 8 10"></path></svg>썸 진행 상황</button>
    <button style="height: 64px; border-radius: 20px; border: 2px solid transparent; background: #FFFFFF; display: flex; align-items: center; gap: 10px; padding: 0 14px; font-family: 'Jua', sans-serif; font-size: 16px; color: #4A2B38; text-align: left">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#C2255C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"></path><path d="M12 7.4l-1.5 4 3 1.5-1.5 4"></path></svg>이별 · 재회</button>
    <button style="grid-column: span 2; height: 64px; border-radius: 20px; border: 2px solid transparent; background: #FFFFFF; display: flex; align-items: center; gap: 10px; padding: 0 14px; font-family: 'Jua', sans-serif; font-size: 16px; color: #4A2B38; text-align: left">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#C2255C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"></rect><path d="M4 10h16M9 3v4M15 3v4"></path></svg>고백해도 좋은 타이밍일까?</button>
  </div>

  <div style="background: #FFFFFF; border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 8px 24px rgba(194, 37, 92, 0.10)">
    <label for="worry" style="font-family: 'Jua', sans-serif; font-size: 16px; color: #C2255C">조금 더 자세히 적어볼까요? (선택)</label>
    <textarea id="worry" rows="4" placeholder="예) 같은 동아리 선배인데, 나한테만 유독 다정한 것 같아요. 그 사람도 날 좋아할까요?" style="border: none; border-radius: 16px; background: #FFF0F5; padding: 12px 14px; font-family: inherit; font-size: 15px; line-height: 1.5; color: #4A2B38; resize: none"></textarea>
  </div>

  <a href="10-TarotDraw.html" style="margin-top: auto; height: 58px; border-radius: 29px; background: #C2255C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: 'Jua', sans-serif; font-size: 19px; text-decoration: none; box-shadow: 0 10px 22px rgba(194, 37, 92, 0.28)">카드 뽑으러 가기
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
  </a>
</div>
</body>
</html>
