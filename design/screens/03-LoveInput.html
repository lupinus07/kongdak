<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>콩닥 나의 연애운 입력</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&amp;family=Gowun+Dodum&amp;display=swap">
<style>
body{margin:0}
a{color:#C2255C}a:hover{color:#A61E4D}
input::placeholder{color:#B88A9C}
.lbl{font-family:'Jua',sans-serif;font-size:16px;color:#C2255C}
.in{height:46px;border-radius:14px;border:none;background:#FFF0F5;padding:0 14px;font-family:inherit;font-size:15px;color:#4A2B38;min-width:0;box-sizing:border-box;width:100%}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;padding:4px;border-radius:14px;background:#FFF0F5}
.seg span{height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:14px;color:#7A5566}
.seg .on{background:#FFFFFF;color:#C2255C;font-family:'Jua',sans-serif;box-shadow:0 2px 6px rgba(194,37,92,.12)}
.chip{padding:6px 11px;border-radius:12px;background:#FFFFFF;font-size:12.5px;color:#A61E4D}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:#6B4A58}
.chk input{width:18px;height:18px;accent-color:#C2255C;margin:0}
</style>
<style>body{background:#F3E6EB;display:flex;justify-content:center;padding:24px 0}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFF0F5; font-family: 'Gowun Dodum', 'Apple SD Gothic Neo', sans-serif; color: #4A2B38; display: flex; flex-direction: column; padding: 24px 20px 24px; gap: 14px; overflow: hidden">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="Main3.dc.html" aria-label="뒤로" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C2255C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <span style="font-family: 'Jua', sans-serif; font-size: 18px">나의 연애운</span>
    <div style="width: 44px; height: 44px"></div>
  </div>

  <div style="display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-family: 'Jua', sans-serif; font-size: 27px; font-weight: 400; line-height: 1.3">올해 내 연애,<br>어떻게 흘러갈까?</h1>
      <p style="margin: 0; font-size: 14px; color: #7A5566">내 사주로 꼼꼼하게 읽는 연애 흐름</p>
    </div>
    <svg width="64" height="64" viewBox="0 0 48 48" aria-hidden="true">
      <circle cx="24" cy="26" r="20" fill="#FFD6E5"></circle>
      <circle cx="18" cy="25" r="2.6" fill="#4A2B38"></circle><circle cx="30" cy="25" r="2.6" fill="#4A2B38"></circle>
      <path d="M20 31q4 4 8 0" stroke="#4A2B38" stroke-width="2" fill="none" stroke-linecap="round"></path>
      <ellipse cx="13" cy="30" rx="3" ry="1.8" fill="#FF8FB3"></ellipse><ellipse cx="35" cy="30" rx="3" ry="1.8" fill="#FF8FB3"></ellipse>
      <path d="M39 3l1.6 4.4L45 9l-4.4 1.6L39 15l-1.6-4.4L33 9l4.4-1.6z" fill="#FFD43B"></path>
    </svg>
  </div>

  <span class="lbl" style="margin-bottom: -6px">지금 내 상황은?</span>
  <div style="display: flex; gap: 6px">
    <button style="height: 40px; padding: 0 15px; border-radius: 20px; border: none; background: #C2255C; color: #FFFFFF; font-family: inherit; font-size: 14px">솔로</button>
    <button style="height: 40px; padding: 0 15px; border-radius: 20px; border: 1.5px solid #F3B6CB; background: #FFFFFF; color: #7A5566; font-family: inherit; font-size: 14px">썸</button>
    <button style="height: 40px; padding: 0 15px; border-radius: 20px; border: 1.5px solid #F3B6CB; background: #FFFFFF; color: #7A5566; font-family: inherit; font-size: 14px">연애 중</button>
    <button style="height: 40px; padding: 0 15px; border-radius: 20px; border: 1.5px solid #F3B6CB; background: #FFFFFF; color: #7A5566; font-family: inherit; font-size: 14px">이별 후</button>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 10px; padding: 12px 14px; border-radius: 16px; border: 1.5px dashed #F3B6CB">
    <span style="grid-column: span 2; font-size: 12px; color: #A61E4D">결과에서 이런 걸 알려드려요</span>
    <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #6B4A58"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#C2255C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>나의 연애 스타일</span>
    <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #6B4A58"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#C2255C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>상황별 맞춤 풀이</span>
    <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #6B4A58"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#C2255C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>잘 맞는 사람</span>
    <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #6B4A58"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#C2255C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>조심할 점</span>
    <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #6B4A58"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#C2255C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>1년 월별 흐름</span>
  </div>

  <div style="background: #FFFFFF; border-radius: 26px; padding: 16px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 8px 24px rgba(194, 37, 92, 0.10)">
    <label for="birth" class="lbl">생년월일</label>
    <div style="display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 8px">
      <input id="birth" class="in" placeholder="2001.05.20">
      <div class="seg" role="radiogroup" aria-label="양력 음력"><span class="on" role="radio" aria-checked="true">양력</span><span role="radio" aria-checked="false">음력</span></div>
    </div>
    <label for="btime" class="lbl">태어난 시간</label>
    <input id="btime" class="in" placeholder="오전 9:30">
    <label class="chk"><input type="checkbox">태어난 시간을 몰라요</label>
    <span class="lbl">성별</span>
    <div class="seg" role="radiogroup" aria-label="성별"><span class="on" role="radio" aria-checked="true">여자</span><span role="radio" aria-checked="false">남자</span></div>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px; align-items: center">
    <a href="06-LoveSample.html" style="font-size: 14px; padding: 4px">샘플 풀이 먼저 보기 ›</a>
    <a href="12-LoginSheet.html" style="width: 100%; height: 58px; border-radius: 29px; background: #C2255C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: 'Jua', sans-serif; font-size: 19px; text-decoration: none; box-shadow: 0 10px 22px rgba(194, 37, 92, 0.28)">내 연애운 보기
      <span style="padding: 3px 10px; border-radius: 12px; background: rgba(255, 255, 255, 0.22); font-family: 'Gowun Dodum', sans-serif; font-size: 13px">990원</span>
    </a>
  </div>
</div>
</body>
</html>
