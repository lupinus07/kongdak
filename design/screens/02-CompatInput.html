<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>콩닥 둘의 궁합 입력</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&amp;family=Gowun+Dodum&amp;display=swap">
<style>
body{margin:0}
a{color:#C2255C}a:hover{color:#A61E4D}
input::placeholder{color:#B88A9C}
.lbl{font-family:'Jua',sans-serif;font-size:16px;color:#C2255C}
.in{height:46px;border-radius:14px;border:none;background:#FFF0F5;padding:0 14px;font-family:inherit;font-size:15px;color:#4A2B38;min-width:0;box-sizing:border-box;width:100%}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;padding:4px;border-radius:14px;background:#FFF0F5}
.seg span{height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:14px;color:#7A5566}
.seg .on{background:#FFFFFF;color:#C2255C;font-family:'Jua',sans-serif;box-shadow:0 2px 6px rgba(194,37,92,.12)}
.chip{padding:6px 11px;border-radius:12px;background:#FFFFFF;font-size:12.5px;color:#A61E4D}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:#6B4A58}
.chk input{width:18px;height:18px;accent-color:#C2255C;margin:0}
</style>
<style>body{background:#F3E6EB;display:flex;justify-content:center;padding:24px 0}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFF0F5; font-family: 'Gowun Dodum', 'Apple SD Gothic Neo', sans-serif; color: #4A2B38; display: flex; flex-direction: column; padding: 24px 20px 24px; gap: 14px; overflow: hidden">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="Main3.dc.html" aria-label="뒤로" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C2255C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <span style="font-family: 'Jua', sans-serif; font-size: 18px">둘의 궁합</span>
    <div style="width: 44px; height: 44px"></div>
  </div>

  <div style="display: flex; align-items: center; justify-content: space-between">
    <h1 style="margin: 0; font-family: 'Jua', sans-serif; font-size: 27px; font-weight: 400; line-height: 1.3">우리 둘,<br>얼마나 잘 맞을까?</h1>
    <svg width="96" height="60" viewBox="0 0 96 60" aria-hidden="true">
      <circle cx="34" cy="34" r="24" fill="#FFD6E5"></circle><circle cx="62" cy="34" r="24" fill="#FFC2D7"></circle>
      <circle cx="27" cy="32" r="2.6" fill="#4A2B38"></circle><circle cx="40" cy="32" r="2.6" fill="#4A2B38"></circle>
      <circle cx="56" cy="32" r="2.6" fill="#4A2B38"></circle><circle cx="69" cy="32" r="2.6" fill="#4A2B38"></circle>
      <path d="M48 16s-6-3.7-6-7.7a3.4 3.4 0 0 1 6-2 3.4 3.4 0 0 1 6 2c0 4-6 7.7-6 7.7z" fill="#FF6B9A"></path>
    </svg>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 10px; padding: 12px 14px; border-radius: 16px; border: 1.5px dashed #F3B6CB">
    <span style="grid-column: span 2; font-size: 12px; color: #A61E4D">결과에서 이런 걸 알려드려요</span>
    <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #6B4A58"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#C2255C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>콩닥지수 (궁합 점수)</span>
    <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #6B4A58"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#C2255C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>잘 맞는 점</span>
    <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #6B4A58"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#C2255C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>조심할 점</span>
    <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #6B4A58"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#C2255C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>더 가까워지는 팁</span>
  </div>

  <span class="lbl" style="margin-bottom: -6px">지금 우리 사이는?</span>
  <div style="display: flex; gap: 8px">
    <button style="height: 40px; padding: 0 16px; border-radius: 20px; border: none; background: #C2255C; color: #FFFFFF; font-family: inherit; font-size: 14px">썸 타는 중</button>
    <button style="height: 40px; padding: 0 16px; border-radius: 20px; border: 1.5px solid #F3B6CB; background: #FFFFFF; color: #7A5566; font-family: inherit; font-size: 14px">연애 중</button>
    <button style="height: 40px; padding: 0 16px; border-radius: 20px; border: 1.5px solid #F3B6CB; background: #FFFFFF; color: #7A5566; font-family: inherit; font-size: 14px">짝사랑</button>
  </div>

  <div style="background: #FFFFFF; border-radius: 26px; padding: 16px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 8px 24px rgba(194, 37, 92, 0.10)">
    <label for="me-b" class="lbl">나</label>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <input id="me-b" class="in" placeholder="2001.05.20">
      <input class="in" aria-label="나의 태어난 시간" placeholder="시간 (선택)">
    </div>
    <div class="seg" role="radiogroup" aria-label="나의 성별"><span class="on" role="radio" aria-checked="true">여자</span><span role="radio" aria-checked="false">남자</span></div>

    <div style="display: flex; align-items: center; gap: 10px; margin: 2px 0">
      <div style="flex: 1; height: 1px; background: #F8D4E1"></div>
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z" fill="#FFC2D7"></path></svg>
      <div style="flex: 1; height: 1px; background: #F8D4E1"></div>
    </div>

    <label for="you-b" class="lbl">그 사람</label>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <input id="you-b" class="in" placeholder="2000.11.03">
      <input class="in" aria-label="그 사람의 태어난 시간" placeholder="시간 (선택)">
    </div>
    <div class="seg" role="radiogroup" aria-label="그 사람의 성별"><span role="radio" aria-checked="false">여자</span><span class="on" role="radio" aria-checked="true">남자</span></div>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px; align-items: center">
    <a href="#" style="font-size: 14px; padding: 4px">샘플 궁합 먼저 보기 ›</a>
    <a href="12-LoginSheet.html" style="width: 100%; height: 58px; border-radius: 29px; background: #C2255C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: 'Jua', sans-serif; font-size: 19px; text-decoration: none; box-shadow: 0 10px 22px rgba(194, 37, 92, 0.28)">우리 궁합 보기
      <span style="padding: 3px 10px; border-radius: 12px; background: rgba(255, 255, 255, 0.22); font-family: 'Gowun Dodum', sans-serif; font-size: 13px">990원</span>
    </a>
  </div>
</div>
</body>
</html>
