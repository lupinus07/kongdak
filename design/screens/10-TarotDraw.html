<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>콩닥 타로 카드 뽑기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&amp;family=Gowun+Dodum&amp;display=swap">
<style>
body{margin:0}
a{color:#C2255C}a:hover{color:#A61E4D}
.card{position:absolute;left:125px;top:40px;width:96px;height:150px;box-sizing:border-box;border-radius:14px;background:#C2255C;border:3px solid #FFFFFF;box-shadow:0 6px 16px rgba(120,20,60,.22);transform-origin:50% 200%;display:flex;align-items:center;justify-content:center}
.card::before{content:"";position:absolute;inset:6px;border:1.5px dashed rgba(255,255,255,.55);border-radius:9px}
</style>
<style>body{background:#F3E6EB;display:flex;justify-content:center;padding:24px 0}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFF0F5; font-family: 'Gowun Dodum', 'Apple SD Gothic Neo', sans-serif; color: #4A2B38; display: flex; flex-direction: column; padding: 24px 22px; gap: 16px; overflow: hidden">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="09-TarotAsk.html" aria-label="뒤로" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C2255C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <span style="font-family: 'Jua', sans-serif; font-size: 18px">카드 뽑기</span>
    <div style="width: 44px; height: 44px"></div>
  </div>

  <div style="align-self: center; display: flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 18px; background: #FFFFFF; font-size: 14px; color: #A61E4D">
    <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z" fill="#FF6B9A"></path></svg>짝사랑 · 그 사람도 날 좋아할까?
  </div>

  <div style="text-align: center; display: flex; flex-direction: column; gap: 4px">
    <h1 style="margin: 0; font-family: 'Jua', sans-serif; font-size: 26px; font-weight: 400; line-height: 1.3">고민을 떠올리면서<br>마음이 가는 카드 한 장</h1>
    <p style="margin: 0; font-size: 14px; color: #7A5566">천천히 골라도 괜찮아요</p>
  </div>

  <div style="position: relative; width: 346px; height: 330px" role="group" aria-label="타로 카드 7장">
    <div class="card" style="transform: rotate(-24deg)"></div>
    <div class="card" style="transform: rotate(-16deg)"></div>
    <div class="card" style="transform: rotate(-8deg)"></div>
    <div class="card" style="transform: rotate(0deg)"></div>
    <div class="card" style="transform: rotate(16deg)"></div>
    <div class="card" style="transform: rotate(24deg)"></div>
    <div class="card" aria-label="선택한 카드" style="transform: rotate(8deg) translateY(-34px); border-color: #FFD43B; box-shadow: 0 0 0 4px rgba(255, 212, 59, 0.45), 0 14px 26px rgba(120, 20, 60, 0.30)">
      <svg width="44" height="44" viewBox="0 0 48 48" aria-hidden="true"><path d="M24 4l3 9 9 3-9 3-3 9-3-9-9-3 9-3z" fill="#FFFFFF"></path><path d="M24 44s-9-5.8-9-12.6a5 5 0 0 1 9-3 5 5 0 0 1 9 3C33 38.2 24 44 24 44z" fill="#FF6B9A"></path></svg>
    </div>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
    <a href="11-TarotResult.html" style="height: 58px; border-radius: 29px; background: #C2255C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'Jua', sans-serif; font-size: 19px; text-decoration: none; box-shadow: 0 10px 22px rgba(194, 37, 92, 0.28)">이 카드로 할게요</a>
    <button style="height: 44px; border: none; background: transparent; font-family: inherit; font-size: 14px; color: #A61E4D">카드 다시 섞기</button>
  </div>
</div>
</body>
</html>
