<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>콩닥 궁합 결과</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&amp;family=Gowun+Dodum&amp;display=swap">
<style>
body{margin:0}
a{color:#C2255C}a:hover{color:#A61E4D}
</style>
<style>body{background:#F3E6EB;display:flex;justify-content:center;padding:24px 0}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFF0F5; font-family: 'Gowun Dodum', 'Apple SD Gothic Neo', sans-serif; color: #4A2B38; display: flex; flex-direction: column; padding: 24px 22px; gap: 16px; overflow: hidden">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="Main.dc.html" aria-label="뒤로" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C2255C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <span style="font-family: 'Jua', sans-serif; font-size: 18px">우리의 궁합</span>
    <div style="width: 44px; height: 44px"></div>
  </div>

  <div style="background: #FFFFFF; border-radius: 32px; padding: 22px 20px; display: flex; flex-direction: column; align-items: center; gap: 10px; box-shadow: 0 8px 24px rgba(194, 37, 92, 0.10)">
    <div style="position: relative; width: 168px; height: 168px">
      <svg width="168" height="168" viewBox="0 0 168 168" aria-hidden="true">
        <circle cx="84" cy="84" r="70" fill="none" stroke="#FFE3EC" stroke-width="16"></circle>
        <circle cx="84" cy="84" r="70" fill="none" stroke="#FF6B9A" stroke-width="16" stroke-linecap="round" stroke-dasharray="383 440" transform="rotate(-90 84 84)"></circle>
      </svg>
      <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center">
        <span style="font-size: 13px; color: #7A5566">콩닥지수</span>
        <span style="font-family: 'Jua', sans-serif; font-size: 52px; color: #C2255C; line-height: 1">87<span style="font-size: 24px">%</span></span>
      </div>
    </div>
    <h1 style="margin: 0; font-family: 'Jua', sans-serif; font-size: 25px; font-weight: 400; text-align: center">말 안 해도 통하는<br>찰떡 콤비</h1>
    <div style="display: flex; flex-wrap: wrap; gap: 6px; justify-content: center">
      <span style="padding: 6px 12px; border-radius: 14px; background: #FFF0F5; font-size: 13px; color: #A61E4D">#대화가_끊이질_않음</span>
      <span style="padding: 6px 12px; border-radius: 14px; background: #FFF0F5; font-size: 13px; color: #A61E4D">#질투는_살짝</span>
      <span style="padding: 6px 12px; border-radius: 14px; background: #FFF0F5; font-size: 13px; color: #A61E4D">#주말데이트_필수</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <div style="background: #FFFFFF; border-radius: 22px; padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start">
      <div style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 18px; background: #FFE3EC; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C2255C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-family: 'Jua', sans-serif; font-size: 16px">잘 맞는 점</span>
        <span style="font-size: 14px; line-height: 1.5; color: #6B4A58">[궁합 풀이 — 두 사람이 잘 맞는 부분]</span>
      </div>
    </div>
    <div style="background: #FFFFFF; border-radius: 22px; padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start">
      <div style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 18px; background: #FFF1DE; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C25A00" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 7v6M12 17v.5"></path></svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-family: 'Jua', sans-serif; font-size: 16px">살짝 조심할 점</span>
        <span style="font-size: 14px; line-height: 1.5; color: #6B4A58">[궁합 풀이 — 부딪힐 수 있는 부분]</span>
      </div>
    </div>
  </div>

  <div style="margin-top: auto; display: flex; gap: 10px">
    <button style="flex: 1; height: 56px; border-radius: 28px; border: 2px solid #C2255C; background: #FFFFFF; color: #C2255C; font-family: 'Jua', sans-serif; font-size: 17px">공유하기</button>
    <button style="flex: 1.4; height: 56px; border-radius: 28px; border: none; background: #C2255C; color: #FFFFFF; font-family: 'Jua', sans-serif; font-size: 17px">상세 풀이 보기</button>
  </div>
</div>
</body>
</html>
